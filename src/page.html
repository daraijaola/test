<div class="cj" id="citrus-jelly" data-preset="orange">
  <canvas class="cj-stage" id="stage" role="img" aria-label="Interactive 3D scene: a soft, translucent gummy citrus slice. Drag it with a mouse or a finger to stretch it."></canvas>

  <div class="cj-ui">
    <header class="cj-mast">
      <p class="cj-eyebrow">Soft-body study <span class="cj-eyebrow__sep" aria-hidden="true">·</span> WebGPU</p>
      <h1 class="cj-title"><span class="cj-title__a">Citrus</span> <span class="cj-title__b">Jelly<span class="cj-title__stop">.</span></span></h1>
      <p class="cj-hint" id="cj-hint"><span class="cj-hint__rule" aria-hidden="true"></span><span class="cj-hint__text">Grab. Stretch. Let go.</span></p>
      <p class="cj-notice" id="cj-notice" role="status" hidden></p>
    </header>

    <section class="cj-fallback" id="cj-fallback" role="alert" tabindex="-1" hidden>
      <p class="cj-fallback__kicker" id="cj-fallback-kicker"></p>
      <h2 class="cj-fallback__title" id="cj-fallback-title"></h2>
      <p class="cj-fallback__body" id="cj-fallback-body"></p>
      <ul class="cj-fallback__steps" id="cj-fallback-steps"></ul>
      <button type="button" class="cj-btn cj-btn--primary cj-fallback__reload" id="cj-reload" hidden>Reload</button>
      <p class="cj-fallback__detail" id="cj-fallback-detail" hidden></p>
    </section>

    <section class="cj-panel" id="cj-panel" aria-label="Controls">
      <div class="cj-group cj-sliders">
        <div class="cj-field">
          <div class="cj-field__head">
            <label class="cj-field__label" for="cj-firmness">Firmness</label>
            <span class="cj-field__value" id="cj-firmness-value" aria-hidden="true">0.50</span>
          </div>
          <input class="cj-range" id="cj-firmness" type="range" min="0" max="1" step="0.01" value="0.5" autocomplete="off">
        </div>
        <div class="cj-field">
          <div class="cj-field__head">
            <label class="cj-field__label" for="cj-damping">Internal damping</label>
            <span class="cj-field__value" id="cj-damping-value" aria-hidden="true">0.50</span>
          </div>
          <input class="cj-range" id="cj-damping" type="range" min="0" max="1" step="0.01" value="0.5" autocomplete="off">
        </div>
      </div>

      <div class="cj-group cj-actions">
        <button type="button" class="cj-btn cj-btn--primary" id="cj-nudge" title="Shortcut: N" aria-keyshortcuts="N">Give it a nudge</button>
        <button type="button" class="cj-btn" id="cj-reset" title="Shortcut: R" aria-keyshortcuts="R">Reset</button>
        <button type="button" class="cj-btn cj-btn--pause" id="cj-pause" title="Shortcut: Space" aria-keyshortcuts="Space">Pause</button>
      </div>

      <div class="cj-group cj-toggles">
        <div class="cj-switch">
          <input type="checkbox" role="switch" id="cj-mesh" autocomplete="off">
          <label for="cj-mesh">Show mesh</label>
          <span class="cj-switch__track" aria-hidden="true"></span>
        </div>
        <div class="cj-switch">
          <input type="checkbox" role="switch" id="cj-slowmo" autocomplete="off">
          <label for="cj-slowmo">¼ speed</label>
          <span class="cj-switch__track" aria-hidden="true"></span>
        </div>
      </div>

      <div class="cj-group cj-presets" role="radiogroup" aria-label="Color">
        <div class="cj-preset cj-preset--orange">
          <input type="radio" name="cj-preset" id="cj-preset-orange" value="orange" checked autocomplete="off">
          <label for="cj-preset-orange">Orange</label>
        </div>
        <div class="cj-preset cj-preset--blood">
          <input type="radio" name="cj-preset" id="cj-preset-blood" value="blood" autocomplete="off">
          <label for="cj-preset-blood">Blood Orange</label>
        </div>
        <div class="cj-preset cj-preset--lemon">
          <input type="radio" name="cj-preset" id="cj-preset-lemon" value="lemon" autocomplete="off">
          <label for="cj-preset-lemon">Lemon</label>
        </div>
      </div>
    </section>

    <p class="cj-sr" id="cj-status" role="status" aria-live="polite"></p>
  </div>
</div>
